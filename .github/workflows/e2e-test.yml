name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "docker-compose.test.yml"
      - ".github/workflows/e2e-test.yml"
      - ".github/actions/setup-monorepo/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "docker-compose.test.yml"
      - ".github/workflows/e2e-test.yml"
      - ".github/actions/setup-monorepo/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Validate & Run E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🏗️ Setup Monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Install Doppler CLI
        run: |
          curl -sLf --retry 3 --tlsv1.2 --proto "=https" \
            'https://packages.doppler.com/public/cli/gpg.DE2A7741A397C129.key' \
            | sudo gpg --dearmor -o /usr/share/keyrings/doppler-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/doppler-archive-keyring.gpg] \
            https://packages.doppler.com/public/cli/deb/debian any-version main" \
            | sudo tee /etc/apt/sources.list.d/doppler-cli.list
          sudo apt-get update && sudo apt-get install -y doppler

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/e2e-tests

      - name: 🚀 Turbo Validate
        run: pnpm turbo run check:ci check:types build --filter=@lasl/e2e-tests

      - name: Create environment file
        run: |
          {
            echo "DOPPLER_TOKEN_AUTHENTICATION_SERVICE=${{ secrets.DOPPLER_TOKEN_AUTHENTICATION_SERVICE }}"
            echo "DOPPLER_TOKEN_API_GATEWAY=${{ secrets.DOPPLER_TOKEN_API_GATEWAY }}"
            echo "DOPPLER_TOKEN_FRONTEND=${{ secrets.DOPPLER_TOKEN_FRONTEND }}"
          } > .env

      - name: 🐳 Start Docker stack
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build --wait --wait-timeout 120

      - name: 🧪 Run E2E tests
        working-directory: packages/e2e-tests
        run: pnpm test
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_E2E_TEST_DEV }}
          CI: true

      - name: 🧹 Tear down Docker stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            packages/e2e-tests/playwright-report/
            packages/e2e-tests/test-results/
          retention-days: 7
